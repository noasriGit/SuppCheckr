evidenceSummary: >
  Coenzyme Q10 (CoQ10) is a compound involved in normal cellular energy processes. According to NCCIH materials, CoQ10
  is naturally present in the body, is found in some foods, and is sold in the United States as a dietary supplement,
  commonly as ubiquinone or ubiquinol in softgel or capsule forms. Supplement labels may list different CoQ10 forms,
  doses per serving, carrier oils, and added ingredients. Research has examined CoQ10 in various health contexts;
  individual needs and medication use vary. SuppCheckr summarizes label and product-comparison information — not medical
  advice. SuppCheckr does not rank CoQ10 products for heart disease, blood pressure, cholesterol, statin use, fertility,
  migraine, Parkinson's disease, anti-aging, or guaranteed energy outcomes.
typicalDosageRange: >
  NCCIH materials describe CoQ10 as a dietary supplement with doses that vary across products and studies. Product
  serving sizes and CoQ10 mg per serving differ by brand, form, and capsule or softgel count. Dietary intake from food
  plus supplemental intake should be considered together. This page does not prescribe a dose. Consult a qualified
  healthcare professional before starting or changing CoQ10 supplements, especially if pregnant, nursing, under 18,
  taking medications (including blood thinners), preparing for surgery, managing a heart condition, liver or kidney
  disease, or another medical condition.
safetyNotes: >
  According to NCCIH materials, no serious side effects of CoQ10 have been reported, though mild effects such as
  insomnia or digestive upsets may occur. NCCIH notes that CoQ10 may interact with the anticoagulant warfarin and the
  diabetes drug insulin, and it may not be compatible with some types of cancer treatment — consult a pharmacist or
  qualified healthcare professional. CoQ10 supplements are not a substitute for medical care or prescribed
  cardiovascular treatment. Product labels, warnings, formulas, and capsule or softgel materials can change — verify the
  current label before use.
interactions: >
  NCCIH materials note potential interactions with warfarin and insulin, and possible incompatibility with some cancer
  treatments. This summary is not a complete interaction list. Do not start, stop, or change medications based on
  supplement marketing. Consult a qualified healthcare professional or pharmacist if you take prescription medications
  or manage a chronic medical condition.
