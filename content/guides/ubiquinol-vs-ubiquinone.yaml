slug: ubiquinol-vs-ubiquinone
title: 'Ubiquinol vs Ubiquinone: Label Differences'
categoryId: coq10
excerpt: >
  Ubiquinol and ubiquinone are labeled CoQ10 forms. Compare names, oils, and price per 100 mg — not assumed absorption
  or medical superiority.
body: |
  ## Introduction

  **Ubiquinone** and **ubiquinol** are the two CoQ10 forms most often named on U.S. dietary-supplement labels.
  Ubiquinone is the oxidized form; ubiquinol is the reduced form. This guide is a **label and shopping-literacy**
  comparison. It does **not** rank one form as medically better, and it does not tell you which form to take.

  According to [NCCIH CoQ10 overview materials](https://www.nccih.nih.gov/health/coenzyme-q10), coenzyme Q10 is
  naturally present in the body, is found in some foods, and is sold as a dietary supplement. SuppCheckr uses that
  background for form names and general safety context — not as a shopping ranking or treatment protocol.

  ## Ubiquinone on labels

  A ubiquinone product should list CoQ10 mg **and** the form word on Supplement Facts when the manufacturer names the
  form. Typical retail formats include:

  - Oil **softgels** with a named ubiquinone line and a carrier oil in other ingredients
  - Dry **vegetarian capsules** with ubiquinone and no carrier oil

  In this draft cluster, [Jarrow Formulas Q-absorb 100 mg (60 softgels)](/supplements/coq10/products/jarrow-q-absorb-coq10-100-mg-60-softgels)
  lists **Coenzyme Q10 (Ubiquinone) 100 mg** per softgel, and
  [NOW Foods CoQ10 200 mg veg capsules (SKU 3176)](/supplements/coq10/products/now-foods-coq10-200-mg-60-veg-capsules)
  lists **Coenzyme Q10 (CoQ10) (Ubiquinone) 200 mg** per capsule. Those are label examples, not form winners.

  ## Ubiquinol on labels

  Ubiquinol products usually name **ubiquinol** (sometimes with a trademarked source such as Kaneka Ubiquinol) and a
  milligram amount per serving. Many are oil softgels. Brand pages often add absorption or “active form” marketing —
  treat that as **brand copy**, not an independent SuppCheckr finding.

  In this draft cluster,
  [Life Extension Super Ubiquinol CoQ10 100 mg (item 01929)](/supplements/coq10/products/life-extension-super-ubiquinol-coq10-100-mg-60-softgels)
  lists **Ubiquinol (as Kaneka Ubiquinol) 100 mg** per softgel with extra virgin olive oil in other ingredients.

  ## Label comparison

  | Factor | Ubiquinone examples in this draft set | Ubiquinol example in this draft set |
  | --- | --- | --- |
  | Form word on Supplement Facts | Ubiquinone (Jarrow 100 mg; NOW 200 mg) | Ubiquinol (Life Extension 100 mg) |
  | CoQ10 mg per labeled serving | 100 mg or 200 mg | 100 mg |
  | Serving format | Oil softgel or dry veg capsule | Oil softgel |
  | Capsule / shell material | Bovine gelatin (Jarrow) or hypromellose (NOW) | Gelatin |
  | Carrier oil | MCT glycerides (Jarrow) or none listed (NOW) | Extra virgin olive oil |
  | Allergen callouts to verify | Jarrow states Contains: Soy | No soy line captured on the cited Life Extension facts |
  | Dated price per 100 mg (2026-09-17 official one-time) | $0.58 (Jarrow 60ct); $0.32 (NOW) | $0.63 (Life Extension) |
  | Testing documentation in this draft | Unknown (Jarrow); claimed manufacturer quality language (NOW) | Unknown |
  | Common marketing themes | High-absorption / delivery systems on some brands | “Active form” / bioavailability claims |

  See the [CoQ10 products comparison table](/supplements/coq10/compare) for side-by-side scores and dated prices. Scores
  summarize label and sourcing quality — not which form is right for you.

  ## Why absorption claims need scrutiny

  Ubiquinol listings often say the form is better absorbed than “standard” ubiquinone. Some ubiquinone brands say a
  delivery system improves absorption. SuppCheckr records those statements as **manufacturer claims**. This guide does
  not convert them into an editorial conclusion that ubiquinol is always better, that ubiquinone is poorly absorbed, or
  that any product is “3×” anything.

  When you compare forms:

  - Confirm the **form word** and **mg per serving** on Supplement Facts
  - Note **oils**, **gelatin vs vegetarian capsules**, and **soy** or other allergen lines
  - Compare **dated price per 100 mg CoQ10**, not bottle price alone
  - Check whether third-party testing is **verified**, **claimed**, or **unknown**

  ## Softgel versus capsule is a separate question

  Form (ubiquinone vs ubiquinol) is not the same as format (softgel vs capsule). NOW’s locked SKU is a dry 200 mg
  vegetarian ubiquinone capsule; the other two locked SKUs are 100 mg oil softgels. Capsule versus softgel is a
  practicality and ingredient-list difference — not proof of medical superiority. The
  [how to choose a CoQ10 supplement](/guides/how-to-choose-a-coq10-supplement) guide covers format, dose-per-serving,
  and price math without a standalone dosage page.

  ## Price per 100 mg is not a health ranking

  Ubiquinol products can cost more per 100 mg than some ubiquinone products. In this three-SKU draft set, the dated
  official one-time prices on 2026-09-17 were **$0.63** per 100 mg (Life Extension ubiquinol), **$0.58** (Jarrow
  ubiquinone 100 mg), and **$0.32** (NOW ubiquinone 200 mg). A lower dated price per 100 mg is a value context field. It
  is not a reason to call a product “best,” and it is not evidence of better personal outcomes.

  Retail prices change. Check the current one-time price on the cited brand page before buying. AutoShip, subscribe, and
  larger-count variants are different offers.

  ## No form winner and no medical advice

  This guide does not pick ubiquinol or ubiquinone. SuppCheckr does not rank CoQ10 products for heart disease, blood
  pressure, cholesterol, statin use, fertility, migraine, Parkinson's disease, anti-aging, or guaranteed energy.

  Dietary supplements are not FDA-approved to diagnose, treat, cure, or prevent disease. CoQ10 supplements are not a
  substitute for medical care or prescribed cardiovascular treatment. Do not start, stop, or change medications based on
  supplement information on this site. Consult a qualified healthcare professional before starting or changing CoQ10
  supplements, especially if pregnant, nursing, under 18, taking medications (including blood thinners), preparing for
  surgery, managing a heart condition, liver or kidney disease, or another medical condition.

  ## Frequently asked questions

  **What is the difference between ubiquinol and ubiquinone?**
  They are labeled CoQ10 forms. Ubiquinone is the oxidized form; ubiquinol is the reduced form. Compare the form word
  and milligrams on Supplement Facts. This is not medical advice.

  **Is ubiquinol always better?**
  No. Products differ in dose per serving, oils, capsule materials, testing documentation, and dated price per 100 mg.
  Absorption marketing varies by brand. SuppCheckr does not treat ubiquinol as universally superior.

  **Why is ubiquinol often more expensive per 100 mg?**
  In this draft set, the named-ubiquinol SKU has a higher dated official price per 100 mg than the two ubiquinone SKUs.
  That is a price-context observation, not a judgment that the premium is “worth it” for health.

  **Does CoQ10 interact with medications?**
  NCCIH materials note potential interactions with warfarin and insulin, and possible incompatibility with some cancer
  treatments. That is general background. Ask a pharmacist or qualified clinician about your medications. SuppCheckr
  does not advise starting or stopping statins or other drugs.

  **Are CoQ10 supplements medical treatment?**
  No. They are dietary supplements. They are not a replacement for prescribed cardiovascular care.

