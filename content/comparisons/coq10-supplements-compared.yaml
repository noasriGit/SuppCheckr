caveats:
  - >-
    NOW Foods CoQ10 200 mg (SKU 3176) scores 86 in this three-SKU draft set. The testing criterion is the rubric
    "claimed" anchor (50), not independent-certification credit. No SKU-matched USP, NSF, or Informed Sport listing
    was captured. Brand cardiovascular-health copy is manufacturer text, not a SuppCheckr conclusion.
  - >-
    Life Extension Super Ubiquinol 100 mg (item 01929) and Jarrow Q-absorb 100 mg (60ct) both score 74. That tie is not
    a winner label. Life Extension testing status is unknown. Brand bioavailability copy is attributed, not independently
    confirmed. AutoShip pricing was not used; the dated one-time price was $37.50 on 2026-09-17 ($0.63 per 100 mg).
  - >-
    Jarrow Q-absorb 100 mg 60-softgel facts disclose soy lecithin and state Contains: Soy. Caramel and carob are listed
    as color agents. The 120-count offer is a different variant and was not used for price math. Testing status is
    unknown. Brand "high absorption" / proliposome language is a manufacturer claim.
  - >-
    All three reviews use a placeholder product image pending licensed pack shots. Affiliate mappings are
    disabled. Official brand URLs are direct retailer links, not Amazon affiliate links.
  - >-
    Phase 15C dated official one-time prices (2026-09-17): Life Extension $37.50, Jarrow 60ct $34.99, NOW $37.99.
    Verify the current one-time price on the brand page before purchase.
  - >-
    A fourth product review remains deferred. This table is not a complete market ranking.
