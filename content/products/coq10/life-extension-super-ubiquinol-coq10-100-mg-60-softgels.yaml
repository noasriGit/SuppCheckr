editorialReview:
  summary: >
    This draft page reviews Life Extension Super Ubiquinol CoQ10, 100 mg, 60 softgels (item 01929) from the official
    brand product page. The Supplement Facts list ubiquinol as Kaneka Ubiquinol at 100 mg per softgel. The 74/100
    CoQ10-profile score reflects clear form and dose disclosure with unknown testing and a mid-range dated price per
    100 mg. It is not a category-wide winner label and not medical advice.
  verified:
    - Official Supplement Facts list Ubiquinol (as Kaneka Ubiquinol) 100 mg per 1 softgel.
    - The 60-softgel bottle provides 60 servings on the cited label.
    - LifeExtension.com listed the one-time price at $37.50 on 2026-09-17 (AutoShip $31.00 was not used).
    - Price per serving and per 100 mg CoQ10 is $0.63 based on $37.50 ÷ 60.
    - No SKU-matched USP, NSF, or Informed Sport listing was captured.
  brandOrRetailerClaims:
    - The brand page states that ubiquinol is more bioavailable than standard ubiquinone CoQ10. SuppCheckr records
      that as a manufacturer claim, not an independent finding that ubiquinol is universally superior.
    - Brand copy discusses heart health, cellular energy, and fatigue. Those statements are not SuppCheckr conclusions
      and are not disease-treatment claims.
    - Suggested use is one softgel with food once or twice daily, or as recommended by a healthcare practitioner.
  labelAndDose: >
    The locked SKU is 100 mg ubiquinol per 1 softgel and 60 servings. Calories (5) and total fat (0.5 g) also appear
    on the official facts panel. Price normalization uses one labeled serving per day even though directions allow
    once or twice daily. Confirm item 01929 and the 60-softgel count before purchase; other Life Extension CoQ10 SKUs
    are different products.
  testing: >
    Testing status is unknown. SuppCheckr did not capture a product-specific certificate or recognized program listing
    for item 01929. Absence of a captured listing is not proof that no program exists; it means this draft does not
    treat the SKU as independently tested. Criterion scores used for the 74 total: ingredientTransparency 100,
    doseTransparency 100, labelClarity 100, thirdPartyTesting 0, priceValue 50, evidenceAlignment 50, additives 100,
    formulaQuality 100, brandTransparency 85 (weights 16/14/12/12/12/14/8/6/6; 74.1 rounds to 74).
  value: >
    The official one-time price was $37.50 on 2026-09-17. $37.50 ÷ 60 servings = $0.63 per serving. Because the serving
    provides 100 mg CoQ10, price per 100 mg is also $0.63. AutoShip $31.00 is a different purchase type and was not
    used. Dated prices change — verify on the brand page.
  format: >
    This SKU is an oil-based gelatin softgel containing named ubiquinol. That is a format fact for comparison with
    Jarrow's 100 mg ubiquinone soy-containing softgel and NOW's 200 mg dry vegetarian ubiquinone capsule — not a
    ranking of which form is better absorbed or medically preferable.
  bottomLine: >
    On cited label facts and dated one-time price math, this is the named-ubiquinol option in the draft CoQ10 set.
    The 74 score is not a category-wide winner label, not proof of independent testing, and not a personal
    recommendation.
  faq:
    - question: Is Life Extension Super Ubiquinol independently tested?
      answer: >
        SuppCheckr recorded testing as unknown for item 01929. No SKU-matched third-party certification was captured.
        Brand marketing is not the same as a captured USP, NSF, or Informed Sport listing.
    - question: Is ubiquinol better than ubiquinone?
      answer: >
        The manufacturer claims greater bioavailability than standard ubiquinone. SuppCheckr does not treat ubiquinol
        as universally superior or ubiquinone as inferior. Form is a label fact for comparison.
    - question: What price did SuppCheckr use?
      answer: >
        The official one-time price of $37.50 on 2026-09-17, equal to $0.63 per 100 mg at one softgel per day. AutoShip
        pricing was not used.
