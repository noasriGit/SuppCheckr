editorialReview:
  summary: >
    This draft page reviews NOW Foods CoQ10 200 mg Veg Capsules (60 count, SKU 3176) from official brand facts locked
    on 2026-09-17. The Supplement Facts list ubiquinone at 200 mg per vegetarian capsule. The 86/100 CoQ10-profile
    score is driven by clear dose/form disclosure and a lower dated price per 100 mg, plus manufacturer quality-claim
    credit at the "claimed" rubric anchor. It is not independent certification and not a category-wide winner label.
  verified:
    - Official Supplement Facts list Coenzyme Q10 (CoQ10) (Ubiquinone) 200 mg per 1 veg capsule.
    - The 60-capsule bottle provides 60 servings on the cited label.
    - NOWFoods.com listed the one-time price at $37.99 on 2026-09-17.
    - Price per serving is $0.63 ($37.99 ÷ 60). Price per 100 mg CoQ10 is $0.32 ($37.99 ÷ 120, because 60 × 200 mg =
      12,000 mg).
    - No SKU-matched USP, NSF, or Informed Sport product listing was captured.
  brandOrRetailerClaims:
    - NOW quality language for this SKU includes GMP / pharmaceutical-grade / all-trans fermented CoQ10 wording.
      SuppCheckr records that as a manufacturer quality claim, not independent product certification.
    - Brand copy includes cardiovascular-health structure/function marketing. That is not a SuppCheckr conclusion and
      is not a disease-treatment claim.
  labelAndDose: >
    The locked SKU is 200 mg ubiquinone per 1 veg capsule and 60 servings. This is a dry capsule (rice flour and
    hypromellose; no carrier oil on the cited other-ingredients list). Confirm SKU 3176 and the 60-count bottle; NOW
    sells other CoQ10 strengths and formats as different products. This page does not recommend an individualized dose.
  testing: >
    Testing status is claimed, not verified. Facility GMP or "pharmaceutical grade" language is not a captured
    product-specific USP, NSF, or Informed Sport listing. SuppCheckr does not mark this SKU as independently tested.
    Do not read the 50 testing score as independent-certification credit. Criterion scores used for the 86 total:
    ingredientTransparency 100, doseTransparency 100, labelClarity 100, thirdPartyTesting 50, priceValue 100,
    evidenceAlignment 50, additives 100, formulaQuality 100, brandTransparency 85 (weights 16/14/12/12/12/14/8/6/6;
    86.1 rounds to 86).
  value: >
    The official one-time price was $37.99 on 2026-09-17. $37.99 ÷ 60 servings = $0.63 per serving. Total CoQ10 is
    12,000 mg, so $37.99 ÷ 120 = $0.32 per 100 mg. That lower per-100-mg figure reflects the 200 mg labeled serving,
    not a judgment that this SKU is the best product. Dated prices change — verify on the brand page.
  format: >
    This SKU is a higher-dose dry vegetarian ubiquinone capsule. Compare that as a format fact with Life Extension's
    100 mg ubiquinol softgel and Jarrow's 100 mg ubiquinone soy-containing softgel. Capsule versus softgel is not a
    winner label.
  bottomLine: >
    On cited label facts and dated one-time price math, this is the 200 mg dry vegetarian ubiquinone option in the
    draft CoQ10 set. The 86 score is the highest of the three drafts because of price per 100 mg and claimed (not
    verified) testing — not a category-wide winner label, not independent lab proof, and not a personal recommendation.
  faq:
    - question: Is NOW CoQ10 200 mg independently tested?
      answer: >
        NOW uses manufacturer quality language. SuppCheckr records testing as claimed, not verified, because no
        SKU-matched third-party product listing was captured for SKU 3176.
    - question: Why is the score higher than the 100 mg softgels?
      answer: >
        The 86 total follows the CoQ10 rubric math: lower dated price per 100 mg (200 mg per serving) and the claimed
        testing anchor (50), versus 0 for unknown testing on the other two SKUs. SuppCheckr does not treat the highest
        score as a category-wide winner.
    - question: What price did SuppCheckr use?
      answer: >
        The official one-time price of $37.99 on 2026-09-17, equal to $0.63 per serving and $0.32 per 100 mg CoQ10.
