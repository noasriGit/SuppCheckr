labelTransparencyNotes: >
  Locked Q-absorb 100 mg / 60 softgels on the official Jarrow PDP (the same URL also sells 120-count — do not mix
  prices or facts). Official other ingredients on 2026-09-17: soy lecithin; softgel (bovine gelatin, glycerin, water,
  caramel [color], and carob); medium chain glycerides (modified coconut and palm oil); mixed tocopherols
  (antioxidant). Contains: Soy. Kaneka Q10 is noted on the official page. Directions are 1 softgel 1–3 times daily
  with food; SuppCheckr price math uses the 1-softgel Supplement Facts serving (one per day). Image TODO: keep
  /images/products/placeholder.svg until licensed reuse rights are documented.
evidenceNotes: >
  SuppCheckr score uses the CoQ10 scoring profile (Phase 15C). Key drivers: named ubiquinone, soy disclosure, and a
  one-softgel 100 mg serving — offset by unknown testing, brand high-absorption marketing, and a mid-range dated $0.58
  per 100 mg. The 74 total ties Life Extension Super Ubiquinol; that is a format distinction, not a winner label.
editorialReview:
  summary: >
    This draft page reviews Jarrow Formulas Q-absorb, 100 mg, 60 softgels from the official brand product page. The
    Supplement Facts list Coenzyme Q10 (Ubiquinone) 100 mg per softgel and disclose soy. The 74/100 CoQ10-profile score
    reflects clear form, dose, and allergen disclosure with unknown testing. Brand absorption claims are attributed to
    the manufacturer and are not SuppCheckr conclusions.
  verified:
    - Official Supplement Facts list Coenzyme Q10 (Ubiquinone) 100 mg per 1 softgel.
    - The 60-softgel count provides 60 servings when 60ct is selected on the cited page.
    - "The official facts panel states Contains: Soy."
    - Jarrow.com listed the 60ct one-time price at $34.99 on 2026-09-17 (120ct $49.99 is a different variant).
    - Price per serving and per 100 mg CoQ10 is $0.58 based on $34.99 ÷ 60.
    - No SKU-matched USP, NSF, or Informed Sport listing was captured.
  brandOrRetailerClaims:
    - The brand describes a proprietary proliposome lipid-soluble delivery system for better absorption. SuppCheckr
      records that as a manufacturer claim, not an independent bioavailability finding.
    - Brand copy mentions mitochondrial function, cellular energy, and healthy cardiovascular function. Those
      statements are not SuppCheckr conclusions and are not disease-treatment claims.
    - Suggested use is 1 softgel 1–3 times daily with food, or as directed by a qualified healthcare professional.
  labelAndDose: >
    The locked SKU is 100 mg ubiquinone per 1 softgel and 60 servings. Confirm the 60-count selection before using the
    $34.99 figure; 120-count is a different offer. Price math uses one labeled serving per day even though directions
    allow up to three softgels daily. Mixed tocopherols are listed as an antioxidant in other ingredients, not as a
    separate Supplement Facts vitamin E amount.
  testing: >
    Testing status is unknown. High-absorption marketing is not a captured certificate. SuppCheckr does not describe
    this SKU as independently tested or independently certified. Criterion scores used for the 74 total:
    ingredientTransparency 100, doseTransparency 100, labelClarity 100, thirdPartyTesting 0, priceValue 50,
    evidenceAlignment 50, additives 100, formulaQuality 100, brandTransparency 85 (weights 16/14/12/12/12/14/8/6/6;
    74.1 rounds to 74).
  value: >
    The official 60ct one-time price was $34.99 on 2026-09-17. $34.99 ÷ 60 = $0.58 per serving and per 100 mg CoQ10.
    Subscribe-and-save or 120ct prices were not used. Dated prices change — verify the 60ct one-time price on the
    brand page.
  format: >
    This SKU is a 100 mg ubiquinone oil softgel that contains soy and bovine gelatin. Compare that as a format fact
    with Life Extension's named-ubiquinol softgel and NOW's soy-free dry vegetarian 200 mg capsule — not as proof that
    ubiquinone is inferior or superior.
  bottomLine: >
    On cited label facts and dated 60ct one-time price math, this is the 100 mg ubiquinone soy-containing softgel in
    the draft CoQ10 set. The 74 score is not a category-wide winner label and not a personal recommendation.
  faq:
    - question: Does Jarrow Q-absorb contain soy?
      answer: >
        Yes. The official Supplement Facts other-ingredients line includes soy lecithin and states Contains: Soy.
    - question: Does SuppCheckr conclude that Q-absorb has high absorption?
      answer: >
        No. "High absorption" and proliposome language come from the manufacturer. SuppCheckr does not convert those
        statements into an independent editorial finding.
    - question: What price did SuppCheckr use?
      answer: >
        The official 60ct one-time price of $34.99 on 2026-09-17, equal to $0.58 per 100 mg at one softgel per day. The
        120ct price is a different variant.
